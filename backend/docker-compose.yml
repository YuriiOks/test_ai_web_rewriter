version: '3.8'

services:
  website-api:
    build: .
    container_name: website-api
    ports:
      - "8000:8000"
    environment:
      - AGENT_ENGINE_URL=http://agent-engine:8001
      - CORS_ORIGINS=["https://yuriodev.co.uk"]
    volumes:
      - ./logs:/app/logs
    networks:
      - backend-network
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge