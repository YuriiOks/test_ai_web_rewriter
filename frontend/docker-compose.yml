services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yuriodev-frontend
    ports:
      - "3000:80"  # <-- IMPORTANT: Changed back to 3000
    restart: unless-stopped
    networks:
      - yuriodev-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"] # <-- Simplified health check
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  yuriodev-network:
    driver: bridge